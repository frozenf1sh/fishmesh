# Historical no-keepalive baseline. The V2 default is
# deploy/baseline/jobs/service-keepalive-baseline.yaml; use the connection-matrix
# overlay when this condition must be reproduced with Gateway keepalive disabled.
apiVersion: batch/v1
kind: Job
metadata:
  name: fishmesh-random-service-baseline
  namespace: kubellm
  labels:
    app.kubernetes.io/name: fishmesh-loadgen
    app.kubernetes.io/component: baseline
  annotations:
    fishmesh.io/experiment: random-service-baseline
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishmesh-loadgen
        app.kubernetes.io/component: baseline
    spec:
      restartPolicy: Never
      serviceAccountName: fishmesh-loadgen
      automountServiceAccountToken: false
      nodeSelector:
        kubellm.io/gpu: "true"
      tolerations:
        - key: kubellm.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: fishmesh:0.2.0-p1
          imagePullPolicy: Never
          command: ["/usr/local/bin/fishmesh-loadgen"]
          env:
            - {name: FISHMESH_RUN_ID, value: random-service-baseline-p0}
            - {name: FISHMESH_GATEWAY_IMAGE, value: "fishmesh:0.2.0-p1"}
            - {name: FISHMESH_VLLM_VERSION, value: "0.23.0"}
            - {name: FISHMESH_CLUSTER_PROFILE, value: k3s-rtx4060-timeslicing-v1}
          args:
            - --requests=200
            - --concurrency=4
            - --prefix-groups=8
            - --prefix-bytes=4096
            - --max-tokens=32
            - --request-timeout=90s
            - --keep-alive=false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
