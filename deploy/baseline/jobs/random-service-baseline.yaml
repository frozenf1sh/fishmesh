apiVersion: batch/v1
kind: Job
metadata:
  name: fishmesh-random-service-baseline
  namespace: kubellm
  labels:
    app.kubernetes.io/name: fishmesh-loadgen
    app.kubernetes.io/component: baseline
  annotations:
    fishmesh.io/experiment: random-service-baseline
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishmesh-loadgen
        app.kubernetes.io/component: baseline
    spec:
      restartPolicy: Never
      serviceAccountName: fishmesh-loadgen
      automountServiceAccountToken: false
      nodeSelector:
        kubellm.io/gpu: "true"
      tolerations:
        - key: kubellm.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: fishmesh:dev
          imagePullPolicy: Never
          command: ["/usr/local/bin/fishmesh-loadgen"]
          args:
            - --requests=200
            - --concurrency=4
            - --prefix-groups=8
            - --prefix-bytes=4096
            - --max-tokens=32
            - --request-timeout=90s
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
