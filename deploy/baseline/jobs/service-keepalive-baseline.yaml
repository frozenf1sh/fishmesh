apiVersion: batch/v1
kind: Job
metadata:
  name: fishmesh-service-keepalive-baseline
  namespace: kubellm
  labels:
    app.kubernetes.io/name: fishmesh-loadgen
    app.kubernetes.io/component: serving-baseline
  annotations:
    fishmesh.io/experiment: service-keepalive-baseline
    fishmesh.io/purpose: v2-serving-baseline
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishmesh-loadgen
        app.kubernetes.io/component: serving-baseline
    spec:
      restartPolicy: Never
      serviceAccountName: fishmesh-loadgen
      automountServiceAccountToken: false
      nodeSelector:
        kubellm.io/gpu: "true"
      tolerations:
        - key: kubellm.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: gateway-startup-delay
          image: busybox:1.36
          command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: loadgen
          image: fishmesh:dev
          imagePullPolicy: Never
          command: ["/usr/local/bin/fishmesh-loadgen"]
          args:
            - --requests=200
            - --concurrency=4
            - --prefix-groups=8
            - --prefix-bytes=4096
            - --prefix-namespace=service-keepalive-baseline-v2
            - --max-tokens=32
            - --request-timeout=90s
            - --keep-alive=true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
