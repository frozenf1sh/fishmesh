apiVersion: v1
kind: ConfigMap
metadata:
  name: fishmesh-gateway-config
  annotations:
    fishmesh.io/routing-mode: load-aware-v1
    fishmesh.io/transport: keep-alive
    fishmesh.io/config-version: v4-load-aware-default
data:
  FISHMESH_LISTEN_ADDRESS: ":8080"
  FISHMESH_UPSTREAM_URL: http://qwen-vllm-baseline.kubellm.svc.cluster.local:8000
  FISHMESH_ROUTING_MODE: load-aware
  FISHMESH_ENDPOINT_DISCOVERY: static
  FISHMESH_ENDPOINT_SERVICE: qwen-vllm
  FISHMESH_ENDPOINT_NAMESPACE: kubellm
  FISHMESH_KUBERNETES_API_URL: ""
  FISHMESH_KUBERNETES_TOKEN_FILE: /var/run/secrets/kubernetes.io/serviceaccount/token
  FISHMESH_KUBERNETES_CA_FILE: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  FISHMESH_ENDPOINT_REFRESH_INTERVAL: 30s
  FISHMESH_ENDPOINT_MAX_AGE: 90s
  FISHMESH_BACKEND_OBSERVATION_MODE: none
  FISHMESH_BACKEND_OBSERVATION_INTERVAL: 15s
  FISHMESH_BACKEND_OBSERVATION_MAX_AGE: 45s
  FISHMESH_BACKEND_OBSERVATION_REQUEST_TIMEOUT: 5s
  FISHMESH_KV_AWARE_HARD_QUEUE_DEPTH: "0"
  FISHMESH_KV_AWARE_HARD_LOCAL_INFLIGHT: "0"
  FISHMESH_RUNTIME_CPU_HARD_LIMIT_CORES: "0"
  FISHMESH_RUNTIME_MEMORY_HARD_LIMIT_BYTES: "0"
  FISHMESH_RUNTIME_GPU_UTILIZATION_HARD_LIMIT_PERCENT: "0"
  FISHMESH_RUNTIME_GPU_MEMORY_HARD_LIMIT_BYTES: "0"
  FISHMESH_RUNTIME_GPU_TEMPERATURE_HARD_LIMIT_CELSIUS: "0"
  FISHMESH_KV_AWARE_ESTIMATOR_MODE: token-cost
  FISHMESH_KV_AWARE_STATIC_PROFILE_FILE: ""
  FISHMESH_BACKEND_ENDPOINTS: ""
  FISHMESH_UPSTREAM_KEEPALIVE: "true"
  FISHMESH_REQUEST_TIMEOUT: 90s
  FISHMESH_SHUTDOWN_TIMEOUT: 30s
  FISHMESH_SESSION_KEY_TTL: 5m
  FISHMESH_SESSION_KEY_MAX_ENTRIES: "10000"
  FISHMESH_SESSION_KEY_INFLIGHT_DELTA: "2"
  FISHMESH_SESSION_KEY_QUEUE_DEPTH_DELTA: "1"
  FISHMESH_MAX_INFLIGHT_REQUESTS: "128"
  FISHMESH_ADMISSION_INITIAL_TARGET: "128"
  FISHMESH_ADMISSION_TUNING_MODE: off
  FISHMESH_ADMISSION_MIN_TARGET: "16"
  FISHMESH_ADMISSION_MAX_TARGET: "128"
  FISHMESH_ADMISSION_TARGET_STEP: "8"
  FISHMESH_ADMISSION_TUNING_INTERVAL: 2s
  FISHMESH_ADMISSION_TUNING_COOLDOWN: 5s
  FISHMESH_MAX_CONNS_PER_HOST: "32"
  FISHMESH_CIRCUIT_EWMA_ALPHA: "0.5"
  FISHMESH_CIRCUIT_ERROR_THRESHOLD: "0.6"
  FISHMESH_CIRCUIT_MIN_REQUESTS: "3"
  FISHMESH_CIRCUIT_OPEN_DURATION: 10s
