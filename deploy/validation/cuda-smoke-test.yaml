apiVersion: v1
kind: ServiceAccount
metadata:
  name: cuda-smoke-test
  namespace: default
  labels:
    app.kubernetes.io/name: cuda-smoke-test
    app.kubernetes.io/part-of: fishmesh
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cuda-smoke-test
  namespace: default
  labels:
    app.kubernetes.io/name: cuda-smoke-test
    app.kubernetes.io/part-of: fishmesh
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cuda-smoke-test
        app.kubernetes.io/part-of: fishmesh
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      serviceAccountName: cuda-smoke-test
      runtimeClassName: nvidia
      nodeSelector:
        kubellm.io/gpu: "true"
      tolerations:
        - key: kubellm.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: cuda-smoke-test
          image: nvcr.io/nvidia/cuda:13.0.2-base-ubuntu24.04
          imagePullPolicy: IfNotPresent
          command: ["nvidia-smi", "--query-gpu=name,driver_version,memory.total", "--format=csv,noheader"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              nvidia.com/gpu: 1
            limits:
              cpu: 500m
              memory: 512Mi
              nvidia.com/gpu: 1
