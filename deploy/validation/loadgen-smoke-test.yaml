apiVersion: batch/v1
kind: Job
metadata:
  name: fishmesh-loadgen-smoke-test
  namespace: kubellm
  labels:
    app.kubernetes.io/name: fishmesh-loadgen-smoke-test
    app.kubernetes.io/part-of: fishmesh
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishmesh-loadgen-smoke-test
        app.kubernetes.io/part-of: fishmesh
    spec:
      restartPolicy: Never
      serviceAccountName: fishmesh-loadgen
      automountServiceAccountToken: false
      nodeSelector:
        kubellm.io/gpu: "true"
      tolerations:
        - key: kubellm.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: fishmesh:0.3.0-p1
          imagePullPolicy: Never
          command: ["/usr/local/bin/fishmesh-loadgen"]
          env:
            - {name: FISHMESH_RUN_ID, value: 2026-08-09-request-path-reliability-smoke}
            - {name: FISHMESH_GIT_SHA, value: bdada54de3e7d3533423a23cb9a1ff769fd1b0fb}
            - {name: FISHMESH_GATEWAY_IMAGE, value: "fishmesh:0.3.0-p1@sha256:036149be62f706b5cc3580e1caf29714282a784bc21c56fc30f88a09d3bc0223"}
            - {name: FISHMESH_VLLM_VERSION, value: "0.23.0"}
            - {name: FISHMESH_CLUSTER_PROFILE, value: k3s-rtx4060-timeslicing-v1}
          args:
            - --requests=8
            - --concurrency=2
            - --prefix-groups=2
            - --prefix-bytes=1024
            - --prefix-namespace=request-path-reliability-smoke
            - --max-tokens=8
            - --request-timeout=90s
            - --keep-alive=true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
