apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-api-smoke-test
  namespace: kubellm
  labels:
    app.kubernetes.io/name: vllm-api-smoke-test
    app.kubernetes.io/part-of: fishmesh
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-api-smoke-test
        app.kubernetes.io/part-of: fishmesh
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubellm.io/gpu: "true"
      tolerations:
        - key: kubellm.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: smoke-test
          image: docker.io/library/busybox:1.37
          imagePullPolicy: Never
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 60); do
                if wget -qO- http://qwen-vllm.kubellm.svc.cluster.local:8000/v1/models; then
                  exit 0
                fi
                sleep 10
              done
              exit 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
