apiVersion: apps/v1
kind: Deployment
metadata:
  name: fishmesh-analyst
  annotations:
    fishmesh.io/design-boundary: "slow read-only control loop; never part of request path"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fishmesh-analyst
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishmesh-analyst
      annotations:
        fishmesh.io/image-amd64-digest: sha256:4e9e242b9b0b19d2b10a58429d343dee69cbd7b18a5e45517396613178117cd9
    spec:
      serviceAccountName: fishmesh-analyst
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      # The current local image import path is linux/amd64. Move this selector to
      # a multi-arch control-plane build once that image pipeline is introduced.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubellm.io/gpu: "true"
      tolerations:
        - key: kubellm.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analyst
          image: fishmesh:0.1.0-p0
          imagePullPolicy: Never
          command: ["/usr/local/bin/fishmesh-analyst"]
          envFrom:
            - configMapRef:
                name: fishmesh-analyst-config
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
