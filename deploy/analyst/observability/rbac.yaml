apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fishmesh-analyst-observer
  annotations:
    fishmesh.io/permission-scope: "namespace-scoped read-only observation"
rules:
  - apiGroups: [""]
    resources: ["events", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fishmesh-analyst-observer
subjects:
  - kind: ServiceAccount
    name: fishmesh-analyst
    namespace: kubellm
roleRef:
  kind: Role
  name: fishmesh-analyst-observer
  apiGroup: rbac.authorization.k8s.io
