# This policy is intentionally not part of the base kustomization because the
# current local K3s Flannel CNI does not enforce NetworkPolicy. Apply it only
# after switching to a policy-capable CNI and validating enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fishmesh-analyst-default-deny
  namespace: kubellm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fishmesh-analyst
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fishmesh-analyst-allow-gateway-metrics
  namespace: kubellm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fishmesh-analyst
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fishmesh-gateway
      ports:
        - protocol: TCP
          port: 8080
