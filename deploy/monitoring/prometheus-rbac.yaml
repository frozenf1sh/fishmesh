apiVersion: v1
kind: ServiceAccount
metadata:
  name: fishmesh-prometheus
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fishmesh-prometheus-target-discovery
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fishmesh-prometheus-target-discovery
subjects:
  - kind: ServiceAccount
    name: fishmesh-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fishmesh-prometheus-target-discovery
