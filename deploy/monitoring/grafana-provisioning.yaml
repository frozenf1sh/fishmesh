apiVersion: v1
kind: ConfigMap
metadata:
  name: fishmesh-grafana-provisioning
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: fishmesh-prometheus
        type: prometheus
        access: proxy
        url: http://fishmesh-prometheus.kubellm.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: fishmesh
        orgId: 1
        folder: FishMesh
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
