apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fishmesh-prometheus-data
  annotations:
    fishmesh.io/data-retention: 7d
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fishmesh-prometheus
  annotations:
    fishmesh.io/scope: namespace-scoped-gateway-metrics-only
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fishmesh-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishmesh-prometheus
    spec:
      serviceAccountName: fishmesh-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.3.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: fishmesh-prometheus-config
        - name: rules
          configMap:
            name: fishmesh-gateway-alert-rules
        - name: data
          persistentVolumeClaim:
            claimName: fishmesh-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: fishmesh-prometheus
spec:
  selector:
    app.kubernetes.io/name: fishmesh-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
