apiVersion: batch/v1
kind: Job
metadata:
  name: fishmesh-session-key-smoke-2
  labels:
    app.kubernetes.io/name: fishmesh-loadgen
    app.kubernetes.io/part-of: fishmesh
    fishmesh.io/experiment: session-key-smoke
  annotations:
    fishmesh.io/purpose: "prove session-key-hit and local-inflight spillover; not a performance benchmark"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishmesh-loadgen
        app.kubernetes.io/part-of: fishmesh
        fishmesh.io/experiment: session-key-smoke
    spec:
      restartPolicy: Never
      serviceAccountName: fishmesh-loadgen
      automountServiceAccountToken: false
      nodeSelector:
        kubellm.io/gpu: "true"
      tolerations:
        - key: kubellm.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: fishmesh:0.2.0-p1
          imagePullPolicy: Never
          command: ["/usr/local/bin/fishmesh-loadgen"]
          env:
            - {name: FISHMESH_RUN_ID, value: 2026-08-09-session-key-runtime-smoke-attempt-2}
            - {name: FISHMESH_GIT_SHA, value: 9f41c5af46c782bb5806d8f074c484bca73d624a}
            - {name: FISHMESH_GATEWAY_IMAGE, value: "fishmesh:0.2.0-p1@sha256:2b80b19f5c25bc33ad1357c5018458211df831224d21954fa814e6c28ca4d60b"}
            - {name: FISHMESH_VLLM_VERSION, value: "0.23.0"}
            - {name: FISHMESH_CLUSTER_PROFILE, value: k3s-rtx4060-timeslicing-v1}
          args:
            - --requests=24
            - --concurrency=8
            - --prefix-groups=1
            - --prefix-bytes=4096
            - --prefix-namespace=session-key-runtime-smoke
            - --hot-prefix-ratio=100
            - --max-tokens=64
            - --request-timeout=90s
            - --keep-alive=true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
