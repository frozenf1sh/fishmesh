apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubellm
resources:
  - ../../r6i22-final/load-balanced
patches:
  - target:
      kind: ConfigMap
      name: fishmesh-gateway-config
    patch: |-
      - op: replace
        path: /data/FISHMESH_ADMISSION_TUNING_MODE
        value: active
      - op: replace
        path: /data/FISHMESH_ADMISSION_INITIAL_TARGET
        value: "16"
      - op: replace
        path: /data/FISHMESH_ADMISSION_MIN_TARGET
        value: "8"
      - op: replace
        path: /data/FISHMESH_ADMISSION_MAX_TARGET
        value: "64"
      - op: replace
        path: /data/FISHMESH_MAX_INFLIGHT_REQUESTS
        value: "64"
      - op: replace
        path: /data/FISHMESH_MAX_CONNS_PER_HOST
        value: "16"
      - op: replace
        path: /metadata/annotations/fishmesh.io~1config-version
        value: r6i27-lb-long-context
      - op: add
        path: /metadata/annotations/fishmesh.io~1experiment
        value: r6i27-long-context-rolling
  - target:
      kind: Deployment
      name: fishmesh-gateway
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/fishmesh.io~1runtime-profile
        value: r6i27-lb-long-context
      - op: replace
        path: /spec/template/metadata/annotations/fishmesh.io~1runtime-config-version
        value: r6i27-gateway-rollout-PLACEHOLDER
  - target:
      kind: Deployment
      name: qwen-vllm
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/5
        value: --gpu-memory-utilization=0.40
      - op: add
        path: /spec/template/metadata/annotations/fishmesh.io~1r6i27-rollout
        value: r6i27-rollout-PLACEHOLDER
