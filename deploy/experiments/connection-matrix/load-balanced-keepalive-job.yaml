apiVersion: batch/v1
kind: Job
metadata:
  name: fishmesh-exp-load-balanced-keepalive
  namespace: kubellm
  labels:
    app.kubernetes.io/name: fishmesh-loadgen
    fishmesh.io/experiment: load-balanced-keepalive
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fishmesh-loadgen
    spec:
      restartPolicy: Never
      serviceAccountName: fishmesh-loadgen
      automountServiceAccountToken: false
      nodeSelector: {kubellm.io/gpu: "true"}
      tolerations:
        - {key: kubellm.io/gpu, operator: Equal, value: "true", effect: NoSchedule}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: loadgen
          image: fishmesh:0.2.0-p1
          imagePullPolicy: Never
          command: ["/usr/local/bin/fishmesh-loadgen"]
          env:
            - {name: FISHMESH_RUN_ID, value: connection-load-balanced-p0}
            - {name: FISHMESH_GATEWAY_IMAGE, value: "fishmesh:0.2.0-p1"}
            - {name: FISHMESH_VLLM_VERSION, value: "0.23.0"}
            - {name: FISHMESH_CLUSTER_PROFILE, value: k3s-rtx4060-timeslicing-v1}
          args: ["--requests=200", "--concurrency=4", "--prefix-groups=8", "--prefix-bytes=4096", "--prefix-namespace=matrix-load-balanced-v1", "--max-tokens=32", "--request-timeout=90s", "--keep-alive=true"]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
