apiVersion: v1
kind: ConfigMap
metadata:
  name: fishmesh-gateway-config
  namespace: kubellm
  annotations:
    fishmesh.io/experiment: load-balanced-keepalive
    fishmesh.io/routing-mode: load-balanced
    fishmesh.io/transport: keep-alive
data:
  FISHMESH_LISTEN_ADDRESS: ":8080"
  FISHMESH_UPSTREAM_URL: http://qwen-vllm-baseline.kubellm.svc.cluster.local:8000
  FISHMESH_ROUTING_MODE: load-balanced
  # Experimental only. Refresh from Ready EndpointSlice before each run.
  FISHMESH_BACKEND_ENDPOINTS: http://10.42.1.35:8000,http://10.42.1.36:8000
  FISHMESH_UPSTREAM_KEEPALIVE: "true"
  FISHMESH_REQUEST_TIMEOUT: 90s
  FISHMESH_SHUTDOWN_TIMEOUT: 30s
