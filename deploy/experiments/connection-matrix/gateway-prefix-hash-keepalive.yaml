apiVersion: v1
kind: ConfigMap
metadata:
  name: fishmesh-gateway-config
  namespace: kubellm
  annotations:
    fishmesh.io/experiment: prefix-affinity-keepalive
    fishmesh.io/endpoint-snapshot: "10.42.1.35,10.42.1.36"
data:
  FISHMESH_LISTEN_ADDRESS: ":8080"
  # Endpoint IPs are captured from the two Ready Pods on 2026-08-08.
  # Refresh this file if the Pods are recreated with different IPs.
  FISHMESH_UPSTREAM_URL: http://qwen-vllm-baseline.kubellm.svc.cluster.local:8000
  FISHMESH_ROUTING_MODE: prefix-affinity
  FISHMESH_BACKEND_ENDPOINTS: http://10.42.1.35:8000,http://10.42.1.36:8000
  FISHMESH_UPSTREAM_KEEPALIVE: "true"
  FISHMESH_REQUEST_TIMEOUT: 90s
  FISHMESH_SHUTDOWN_TIMEOUT: 30s
