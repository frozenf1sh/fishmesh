apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubellm
resources:
  - ../../lite-kv-aware
patches:
  - target:
      kind: ConfigMap
      name: fishmesh-gateway-config
    patch: |-
      - op: replace
        path: /data/FISHMESH_ROUTING_MODE
        value: load-balanced
      - op: replace
        path: /data/FISHMESH_MAX_INFLIGHT_REQUESTS
        value: "256"
      - op: replace
        path: /data/FISHMESH_MAX_CONNS_PER_HOST
        value: "64"
      - op: replace
        path: /metadata/annotations/fishmesh.io~1config-version
        value: r6g-high-pressure
      - op: replace
        path: /metadata/annotations/fishmesh.io~1routing-mode
        value: load-balanced-v1
  - target:
      kind: Deployment
      name: fishmesh-gateway
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/fishmesh.io~1runtime-profile
        value: high-pressure-load-balanced
