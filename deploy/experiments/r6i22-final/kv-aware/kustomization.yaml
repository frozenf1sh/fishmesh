apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubellm
resources:
  - ../base
patches:
  - target:
      kind: ConfigMap
      name: fishmesh-gateway-config
    patch: |-
      - op: replace
        path: /metadata/annotations/fishmesh.io~1config-version
        value: r6i22-kv-aware
  - target:
      kind: Deployment
      name: fishmesh-gateway
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/fishmesh.io~1runtime-config-version
        value: r6i22-kv-aware
