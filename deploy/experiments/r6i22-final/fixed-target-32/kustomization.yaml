apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubellm
resources:
  - ../load-balanced
patches:
  - target:
      kind: ConfigMap
      name: fishmesh-gateway-config
    patch: |-
      - op: replace
        path: /data/FISHMESH_ADMISSION_INITIAL_TARGET
        value: "32"
      - op: replace
        path: /data/FISHMESH_ADMISSION_TUNING_MODE
        value: "off"
      - op: replace
        path: /metadata/annotations/fishmesh.io~1config-version
        value: r6i22-fixed-target-32
      - op: add
        path: /metadata/annotations/fishmesh.io~1admission-tuning
        value: fixed-target-32
  - target:
      kind: Deployment
      name: fishmesh-gateway
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/fishmesh.io~1runtime-config-version
        value: r6i22-fixed-target-32
