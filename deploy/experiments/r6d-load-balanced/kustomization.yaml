apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubellm
resources:
  - ../../lite-kv-aware
patches:
  - target:
      kind: ConfigMap
      name: fishmesh-gateway-config
    patch: |-
      - op: replace
        path: /data/FISHMESH_ROUTING_MODE
        value: load-balanced
      - op: replace
        path: /metadata/annotations/fishmesh.io~1routing-mode
        value: load-balanced-v1
      - op: replace
        path: /metadata/annotations/fishmesh.io~1config-version
        value: r6d-load-balanced
  - target:
      kind: Deployment
      name: fishmesh-gateway
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/fishmesh.io~1runtime-profile
        value: r6d-load-balanced
