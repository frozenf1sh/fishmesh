apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubellm
resources:
  - ../../r6i22-final/load-balanced
patches:
  - target:
      kind: ConfigMap
      name: fishmesh-gateway-config
    patch: |-
      - op: replace
        path: /data/FISHMESH_ADMISSION_TUNING_MODE
        value: active
      - op: replace
        path: /data/FISHMESH_ADMISSION_INITIAL_TARGET
        value: "32"
      - op: replace
        path: /data/FISHMESH_ADMISSION_MIN_TARGET
        value: "16"
      - op: replace
        path: /data/FISHMESH_ADMISSION_MAX_TARGET
        value: "128"
      - op: replace
        path: /metadata/annotations/fishmesh.io~1config-version
        value: r6i25-load-balanced-active
      - op: add
        path: /metadata/annotations/fishmesh.io~1admission-tuning
        value: active-r6i25
  - target:
      kind: Deployment
      name: fishmesh-gateway
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/fishmesh.io~1runtime-config-version
        value: r6i25-load-balanced-active
  - target:
      kind: Deployment
      name: qwen-vllm
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/fishmesh.io~1r6i25-replay-reset
        value: r6i25-shared-generation
      - op: add
        path: /spec/template/metadata/annotations/fishmesh.io~1r6i22-replay-reset
        value: r6i22-b2-replay-reset
