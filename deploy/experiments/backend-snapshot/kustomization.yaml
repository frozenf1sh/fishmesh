apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubellm
resources:
  - ../endpoint-slice
patches:
  - target:
      kind: ConfigMap
      name: fishmesh-gateway-config
    patch: |-
      - op: replace
        path: /data/FISHMESH_BACKEND_OBSERVATION_MODE
        value: prometheus
      - op: replace
        path: /data/FISHMESH_BACKEND_OBSERVATION_INTERVAL
        value: 10s
      - op: replace
        path: /data/FISHMESH_BACKEND_OBSERVATION_MAX_AGE
        value: 30s
      - op: replace
        path: /metadata/annotations/fishmesh.io~1config-version
        value: v4-backend-snapshot-experiment
