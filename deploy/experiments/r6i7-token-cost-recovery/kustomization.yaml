apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubellm
resources:
  - ../r6i6-calibration
patches:
  - target:
      kind: ConfigMap
      name: fishmesh-gateway-config
    patch: |-
      - op: add
        path: /data/FISHMESH_PREDICTION_MODE
        value: "off"
      - op: replace
        path: /metadata/annotations/fishmesh.io~1config-version
        value: r6i7-token-cost-recovery
  - target:
      kind: Deployment
      name: qwen-vllm
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/fishmesh.io~1r6i7-replay-reset
        value: r6i7-20260816
