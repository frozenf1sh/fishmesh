apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fishmesh-gateway-endpointslice-reader
  annotations:
    fishmesh.io/permission-scope: "namespace-scoped read-only EndpointSlice discovery"
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fishmesh-gateway-endpointslice-reader
subjects:
  - kind: ServiceAccount
    name: fishmesh-gateway
    namespace: kubellm
roleRef:
  kind: Role
  name: fishmesh-gateway-endpointslice-reader
  apiGroup: rbac.authorization.k8s.io
