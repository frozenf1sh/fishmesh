apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubellm
resources:
  - ../../lite-kv-aware
patches:
  - target:
      kind: ConfigMap
      name: fishmesh-gateway-config
    patch: |-
      - op: replace
        path: /data/FISHMESH_ADMISSION_TUNING_MODE
        value: shadow
      - op: replace
        path: /metadata/annotations/fishmesh.io~1config-version
        value: r6i-admission-shadow
      - op: add
        path: /metadata/annotations/fishmesh.io~1admission-tuning
        value: shadow
  - target:
      kind: Deployment
      name: fishmesh-gateway
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/fishmesh.io~1runtime-profile
        value: admission-shadow
