apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubellm
resources:
  - ../../lite-exact
patches:
  - target:
      kind: ConfigMap
      name: fishmesh-gateway-config
    patch: |-
      - op: replace
        path: /data/FISHMESH_ROUTING_MODE
        value: bounded-affinity
      - op: replace
        path: /metadata/annotations/fishmesh.io~1routing-mode
        value: bounded-affinity-v1
      - op: replace
        path: /metadata/annotations/fishmesh.io~1config-version
        value: r6d-post-benchmark-bounded-affinity
  - target:
      kind: Deployment
      name: fishmesh-gateway
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/fishmesh.io~1runtime-profile
        value: r6d-post-benchmark-bounded-affinity
