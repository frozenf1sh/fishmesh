apiVersion: v1
kind: Namespace
metadata:
  name: kubellm
  labels:
    app.kubernetes.io/part-of: fishmesh
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-vllm
  namespace: kubellm
  labels:
    app.kubernetes.io/name: qwen-vllm
    app.kubernetes.io/part-of: fishmesh
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: qwen-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-vllm
  namespace: kubellm
  labels:
    app.kubernetes.io/name: qwen-vllm
    app.kubernetes.io/part-of: fishmesh
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 1200
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # This profile exposes one physical GPU as two time-sliced resources.
      # Never create a third vLLM Pod during an upgrade.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen-vllm
        app.kubernetes.io/part-of: fishmesh
      annotations:
        fishmesh.io/vllm-image-amd64-digest: sha256:3a1e7f5904e1a1192a02aa0086ceaffc33985d7044c7bb25b3a43d61bdbe3ac0
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubellm.io/gpu: "true"
      tolerations:
        - key: kubellm.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: vllm
          # Offline K3s resolves this preloaded tag. The verified amd64 digest is
          # recorded on the Pod template because NeverPull cannot resolve tag@digest
          # unless that KV-aware composite reference was imported into containerd.
          image: docker.io/vllm/vllm-openai:v0.23.0
          imagePullPolicy: Never
          args:
            - /models/Qwen2.5-0.5B-Instruct
            - --served-model-name=qwen2.5-0.5b-instruct
            - --host=0.0.0.0
            - --port=8000
            - --dtype=half
            - --gpu-memory-utilization=0.35
            - --max-model-len=4096
            - --enable-prefix-caching
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_LOGGING_LEVEL
              value: INFO
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 6Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: qwen-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qwen-vllm
  namespace: kubellm
  labels:
    app.kubernetes.io/name: qwen-vllm
    app.kubernetes.io/part-of: fishmesh
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen-vllm
