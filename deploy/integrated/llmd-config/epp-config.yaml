apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
  - type: fishmesh-session-key-scorer
    name: fishmesh-session-key
    parameters:
      sessionKeyHeader: x-fishmesh-session-key
      metricsMaxAge: 45s
      sessionKeyTTL: 5m
      maxSessionKeyEntries: 10000
      inflightDelta: 2
      queueDepthDelta: 1
  - type: max-score-picker
  - type: single-profile-handler
schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: fishmesh-session-key
        weight: 1
      - pluginRef: max-score-picker
