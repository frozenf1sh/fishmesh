apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: lite-kv-aware
    app.kubernetes.io/name: fishmesh-gateway
    app.kubernetes.io/part-of: fishmesh
  name: fishmesh-gateway
  namespace: kubellm
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fishmesh-gateway
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        fishmesh.io/gateway-image-revision: r6i31-4a7c538-20260816230146
        fishmesh.io/image-amd64-digest: sha256:903c10b37dbc359946bff8dc592d3d6c96841e7f86afd4e35b607fda25c05553
        fishmesh.io/r6i31-gateway-rollout: r1-la-gateway
        fishmesh.io/runtime-config-version: r6i30-load-aware
        fishmesh.io/runtime-profile: r6i31-conversation-ladder-load-aware
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: fishmesh-gateway
    spec:
      automountServiceAccountToken: true
      containers:
      - command:
        - /usr/local/bin/fishmesh-gateway
        envFrom:
        - configMapRef:
            name: fishmesh-gateway-config
        image: fishmesh-gateway:r6i31-4a7c538-20260816230146
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        name: gateway
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      nodeSelector:
        kubellm.io/gpu: "true"
        kubernetes.io/arch: amd64
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: fishmesh-gateway
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: kubellm.io/gpu
        operator: Equal
        value: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: lite-kv-aware
    app.kubernetes.io/name: qwen-vllm
    app.kubernetes.io/part-of: fishmesh
  name: qwen-vllm
  namespace: kubellm
spec:
  progressDeadlineSeconds: 1200
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen-vllm
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        fishmesh.io/r6i31-rollout: r1-la
        fishmesh.io/vllm-image-amd64-digest: sha256:3a1e7f5904e1a1192a02aa0086ceaffc33985d7044c7bb25b3a43d61bdbe3ac0
      labels:
        app.kubernetes.io/name: qwen-vllm
        app.kubernetes.io/part-of: fishmesh
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - /models/Qwen2.5-0.5B-Instruct
        - --served-model-name=qwen2.5-0.5b-instruct
        - --host=0.0.0.0
        - --port=8000
        - --dtype=half
        - --gpu-memory-utilization=0.40
        - --max-model-len=32768
        - --enable-prefix-caching
        - --kv-events-config={"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558","buffer_steps":4096,"hwm":10000,"max_queue_size":10000,"topic":"kv@$(POD_IP):8000@qwen2.5-0.5b-instruct"}
        - --enable-chunked-prefill
        - --max-num-batched-tokens=8K
        - --max-num-seqs=3
        env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: VLLM_LOGGING_LEVEL
          value: INFO
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: docker.io/vllm/vllm-openai:v0.23.0
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
        name: vllm
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 5557
          name: kv-events
          protocol: TCP
        - containerPort: 5558
          name: kv-replay
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        resources:
          limits:
            cpu: "4"
            memory: 6Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "1"
            memory: 4Gi
            nvidia.com/gpu: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 90
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        volumeMounts:
        - mountPath: /models
          name: model-cache
          readOnly: true
        - mountPath: /dev/shm
          name: dshm
      nodeSelector:
        kubellm.io/gpu: "true"
      runtimeClassName: nvidia
      securityContext:
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      tolerations:
      - effect: NoSchedule
        key: kubellm.io/gpu
        operator: Equal
        value: "true"
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: qwen-models
      - emptyDir:
          medium: Memory
          sizeLimit: 1Gi
        name: dshm
---
