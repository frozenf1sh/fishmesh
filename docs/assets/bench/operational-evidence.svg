<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Reliability and observability evidence</title>
  <desc id="desc">Formal request success, KV status availability, degradation count, restart count and observed operational metrics.</desc>
  <rect width="1200" height="560" fill="#ffffff"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172033">
    <text x="64" y="46" font-size="26" font-weight="700">Reliability and observability evidence</text>
    <text x="64" y="72" font-size="14" fill="#64748b">Final two-route comparison · formal benchmark traffic excludes rollout warmup</text>
    <rect x="64" y="112" width="1072" height="270" fill="none" stroke="#d6deea"/>
    <g stroke="#e9eef5"><line x1="300" y1="130" x2="300" y2="360"/><line x1="500" y1="130" x2="500" y2="360"/><line x1="700" y1="130" x2="700" y2="360"/><line x1="900" y1="130" x2="900" y2="360"/><line x1="1100" y1="130" x2="1100" y2="360"/></g>
    <g font-size="11" fill="#64748b"><text x="300" y="378" text-anchor="middle">0%</text><text x="500" y="378" text-anchor="middle">25%</text><text x="700" y="378" text-anchor="middle">50%</text><text x="900" y="378" text-anchor="middle">75%</text><text x="1100" y="378" text-anchor="middle">100%</text></g>
    <g font-size="14"><text x="285" y="176" text-anchor="end">Formal request success</text><text x="285" y="236" text-anchor="end">KV status available</text><text x="285" y="296" text-anchor="end">KV degradation</text><text x="285" y="356" text-anchor="end">New Pod restarts</text></g>
    <rect x="300" y="160" width="800" height="28" fill="#16a6a0"/><circle cx="1100" cy="174" r="7" fill="#16a6a0"/><text x="1115" y="179" font-size="13">768 / 768</text>
    <rect x="300" y="220" width="800" height="28" fill="#5b7cfa"/><circle cx="1100" cy="234" r="7" fill="#5b7cfa"/><text x="1115" y="239" font-size="13">384 / 384</text>
    <circle cx="300" cy="294" r="7" fill="#f59e0b"/><text x="315" y="299" font-size="13">0 events</text>
    <circle cx="300" cy="354" r="7" fill="#f59e0b"/><text x="315" y="359" font-size="13">0 observed</text>
    <text x="600" y="414" text-anchor="middle" font-size="11" fill="#64748b">share / event rate</text>
    <line x1="64" y1="452" x2="1136" y2="452" stroke="#d6deea"/>
    <g><text x="64" y="484" font-size="12" fill="#64748b">KV event publish → apply P95</text><text x="64" y="514" font-size="24" font-weight="700">0.95 ms</text></g>
    <g><text x="430" y="484" font-size="12" fill="#64748b">Gateway memory during pressure</text><text x="430" y="514" font-size="24" font-weight="700">13–21 MiB</text></g>
    <g><text x="820" y="484" font-size="12" fill="#64748b">Final GPU temperature</text><text x="820" y="514" font-size="24" font-weight="700">44°C</text></g>
  </g>
</svg>
